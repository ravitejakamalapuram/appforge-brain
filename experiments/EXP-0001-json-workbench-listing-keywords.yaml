id: EXP-0001
title: "JSON Workbench: CWS title + short-description keyword rewrite (discovery test)"
tags: [json-workbench, growth, chrome-web-store, listing, discovery, copy]
product_id: json-workbench
status: selected # draft|selected|awaiting_approval|running|readout|stopped
owner: growth
opened: "2026-09-28"
last_revised: "2026-09-29"
source_issue: APP-34
decision_ref: >
  DEC-0003 (first factory loop runs on json-workbench) is the authority the work proceeds under.
  DEC-0006 (CEO, 2026-09-28) approved the DRAFT and the PR only, not the publish. DEC-0014 (CEO,
  2026-09-28) REPLACES DEC-0006's measurement section and is the governing falsifier — see
  `kill_criterion`. CEO ruling on APP-34 card e173d7ea (2026-09-29) selects the pairing and the
  publish path.
opportunity: research/opportunities/OPP-0001-json-workbench-activation.yaml
summary: >
  Two candidate listing titles and two candidate short descriptions for the live CWS item, drafted
  to test OPP-0001 q07: that JSON Workbench is invisible on the query its audience actually types.
  Copy only — no code, no screenshots, no permission change. The CEO has SELECTED T1 + S1 and ruled
  that both fields ship together in one patch release. NOT PUBLISHED: the publish is board-gated at
  G7 and its date is constrained by DEC-0014's window arithmetic.

hypothesis: >
  The binding constraint on JSON Workbench installs is discovery, and discovery is a copy problem:
  the listing title spends 14 characters on the bare product name and neither the title nor the
  short description contains "viewer", "formatter", "JSONL" or "NDJSON" — the words the
  FormatArc/Dadroit/DEV audience (OPP-0001 E1/E2/E3) searches. Putting those words in the two
  indexed fields should raise CWS search impressions.

# ---------------------------------------------------------------------------
# THE DRAFT COPY
# ---------------------------------------------------------------------------
current:
  title: "JSON Workbench"                 # 14 chars
  short_description: "Inspect, transform, validate, diff, and query large JSON locally. Nothing leaves your browser."  # 94 of 132
  note: >
    The current short description is accurate and privacy-forward but leads with five verbs. It
    contains no noun anyone searches for except "JSON", and it never says JSONL or NDJSON.

character_budget:
  field: "apps/extension/manifest.json -> name (this is the CWS item title; see publish_path)"
  hard_limit: 75
  hard_limit_source: >
    release-platform CHROME_RULES.name = 75, which is the manifest `name` ceiling and the limit that
    would actually reject the package. CORRECTED 2026-09-29. Earlier revisions of this record, and
    OPP-0001 and APP-34 before it, described 45 as "the cap" and as "the manifest `name` limit".
    It is neither. 45 is roughly where the Chrome Web Store TRUNCATES the displayed title.
  practical_target: 45
  why_target_not_limit: >
    Characters past ~45 are not indexed-and-invisible, they are simply not shown in the places a
    searcher decides from — the search result row and the category tile. Spending budget past the
    truncation point buys nothing for discovery, which is the whole point of this experiment. Both
    candidates were written to 45 and are unaffected by the correction.

title_candidates:
  - id: T1
    text: "JSON Workbench - Large JSON & JSONL Viewer"
    length: 42
    targets: ["large json viewer", "large json file", "jsonl viewer", "jsonl"]
    rationale: >
      SELECTED by the CEO on 2026-09-29. Spends the character budget on the query we can actually
      win. OPP-0001's positioning read-through is explicit that the "pretty-print this JSON tab" job
      is won and saturated, so the word "formatter" would put us in a query headed by a
      2,000,000-user listing literally named "JSON Formatter". "Viewer" is the category term we can
      rank in when it is qualified by "large" or "JSONL", which is the one axis no incumbent serves
      (E1). At 42 characters it also sits inside the ~45 display truncation with three characters of
      margin.
  - id: T2
    text: "JSON Workbench: Large JSON Viewer & Formatter"
    length: 45
    targets: ["json viewer", "json formatter", "large json"]
    rationale: >
      NOT SELECTED. Carries both category terms in the title itself, which was the most literal
      reading of the APP-34 handoff. Cost: it enters the saturated "json formatter" query where we
      will not outrank the incumbents, and it drops "JSONL" — the highest-intent, lowest-competition
      term available to us. The CEO's ruling: "T2 spends scarce characters re-entering `json
      formatter` at the small-file end where your own benchmark says we have no advantage, and drops
      JSONL to pay for it."

short_description_candidates:
  - id: S1
    text: "Open large JSON, JSONL and NDJSON files in your browser - search, query with SQL, jq or JSONata, and diff. Fully local."
    length: 119
    limit: 132
    targets: ["large json file", "open large json file", "jsonl", "ndjson"]
    rationale: >
      SELECTED by the CEO on 2026-09-29. Leads with the job (open a large file) rather than a
      feature list, as the handoff requires, and mirrors the phrasing of the E2 search market ("how
      to open a large JSON file"). Pairs with T1 without repeating it word-for-word.
  - id: S2
    text: "A JSON viewer and formatter built for large JSON, JSONL and NDJSON files. Query with SQL, jq or JSONata. Nothing uploads."
    length: 121
    limit: 132
    targets: ["json viewer", "json formatter", "large json", "jsonl", "ndjson"]
    rationale: >
      NOT SELECTED. Was the right pairing only if the CEO wanted "formatter" in the indexed text.
      Leads with the category nouns instead of the job, which is weaker against the handoff's "lead
      with the large-file / JSONL job" instruction.

selection:
  pairing: "T1 + S1"
  ruled_by: "CEO"
  ruled_on: "2026-09-29"
  recorded_at: "APP-34 interaction card e173d7ea (option ids t1_s1, bundle); reasoning in the CEO's APP-34 comment of the same date"
  reasoning: >
    Confirmation of Growth's recommendation rather than an override. Leading with the large-file /
    JSONL job is the thesis; conceding the saturated "json formatter" query to a ~2M-user incumbent
    is the right trade and was explicitly ruled "not one to hedge".
  consequence: >
    "Formatter" now appears in NEITHER indexed field, because S2 was the candidate carrying it and
    S2 was not selected. Growth flags this as a deliberate, ruled trade rather than an oversight:
    the term is conceded. It does remain in the long description, which is indexed less strongly.

recommendation_corroborated: >
  The CEO's 2026-09-28 reply on APP-34 independently argues the same brief this draft was written
  to: FormatArc's 2026-07-11 benchmark found only 2 of 6 CWS extensions format a 10 MB JSON file
  and none format 50 MB, with the ~2M-user category leader giving up at 10 MB, so the unserved job
  is large-file/JSONL and the characters should be spent there, job first rather than feature list.
  That is precisely the T1 + S1 thesis and it is what the 2026-09-29 selection turned on. NOTE the
  benchmark still may NOT appear as listing text: it is a comparative claim about named third-party
  products and is not traceable to product-facts.yaml. It belongs on the landing page and in launch
  posts. See claim_traceability.deliberately_omitted.

not_keyword_stuffing: >
  Every term in every candidate names a file format the product actually reads or a capability it
  actually ships, each appears once, and each title still reads as a product name followed by one
  plain-English descriptor - no repeated terms, no comma lists of synonyms, no competitor names.

claim_traceability:
  checked_against: products/json-workbench/product-facts.yaml
  supported:
    - "large JSON, JSONL and NDJSON files - already in the live listing description and STORE_LISTING.md"
    - "SQL (DuckDB-WASM), jq, JSONata, diff - shipped features, in the live description"
    - "local / nothing uploads - product-facts records no data collection; manifest requests no host permissions on default install"
  deliberately_omitted:
    - claim: "a specific file-size number (e.g. '100 MB' or '500 MB')"
      why: >
        The only size figures in the company are OPP-0001's own bench (10 MB / 244 ms, 100 MB /
        2.29 s, 500 MB / 11.82 s), they are explicitly PARSER THROUGHPUT ONLY rather than
        end-to-end UI, and they are not recorded in product-facts.yaml. Growth may not publish a
        claim that is not traceable there (AGENTS.md Forbidden). If a size number is wanted in the
        copy, CPO/CTO must first land the measured figure in product-facts.yaml as an end-to-end
        fact.
    - claim: "comparative claims such as 'files other viewers cannot open'"
      why: >
        True per the FormatArc benchmark (E1) but it is a claim about third-party products in a
        store listing, is not traceable to product-facts.yaml, and invites a CWS policy complaint.
        Keep it in launch posts and the landing page, not the listing.

# ---------------------------------------------------------------------------
# MEASUREMENT + PRE-REGISTERED KILL CRITERION
# ---------------------------------------------------------------------------
kill_criterion:
  authority: >
    DEC-0014 (CEO, 2026-09-28). This REPLACES DEC-0006's "The measurement, settled" section in full.
    AMENDED IN PART by DEC-0018 (CEO, 2026-09-29, APP-185), which moves the clock on the readability
    floor and adds a mandatory pre-publish archive. Read the two together; every number DEC-0014
    pre-registered is unchanged.
  supersedes:
    - record: "DEC-0006 / APP-34's 'weekly CWS impressions, 4 weeks after vs. 4 weeks before, must at least double'"
      why: >
        The 2x threshold is NOT moved. The WINDOW underneath it was incapable of producing a
        failure: with first-publish no earlier than 2026-09-23 and the rewrite unpublished, a
        "4 weeks before" window held about 5 days on which a listing existed at all against 23 days
        of structural zero. Holding impressions per live day exactly flat — the rewrite doing
        nothing — the 28-day sum ratio is 28/5 = 5.6x. The criterion returned PASS for every
        possible outcome including the one where the rewrite makes things worse. Growth flagged this
        window defect on APP-34 on 2026-09-28 and QA filed it as APP-59; DEC-0014 is the ruling.
    - record: "OPP-0001 q14(a), 'triple installs within 28 days of the rewrite plus one distribution post'"
      why: "Discarded outright by the CEO on APP-34, 2026-09-28 — not merely superseded. Impressions rather than installs because the hypothesis is about reach; 2x not 3x; copy-only, with the distribution post deferred so the two interventions cannot confound. CPO still owes the tidy-up amendment on OPP-0001 itself."
  construction:
    unit: "MEAN DAILY CWS impressions over LIVE days. Never a window sum."
    live_day: "A day is live only if the listing was published on it."
    pre_window: "The N live days immediately preceding the rewrite publish date P."
    post_window: "The N live days beginning three days after P."
    N: "Identical on both sides by construction. N <= min(28, P - F - 7), and N must be >= 14 for the read to be decision-grade."
    exclusions:
      - "The first 7 live days after first-publish F are excluded from the pre-window as launch novelty."
      - "The 3 days after P are excluded from the post-window as CWS re-index propagation. This cuts both ways: it guards against a false FAIL before the edit is live in search, and against a false PASS off a short non-durable re-index bump."
    readability_floor:
      value: 20
      applies_to: "pre-window total impressions"
      evaluated: >
        AMENDED by DEC-0018. DEC-0014 said "AT P, before any post-window data exists", which is not
        executable: the pre-window ends at P - 1 and the dashboard does not report that day until
        T = P - 1 + L, so for any reporting lag L >= 1 an evaluation at P silently covers only
        N - L of the N days. The floor is instead determined from the FIRST export — smallest
        qualifying as_of, so there is nothing to choose between — whose as_of >= P - 1, provided all
        three of: as_of <= P + 2; the export carries complete daily coverage of [P - N, P - 1]; and
        ONLY rows dated <= P - 1 enter the arithmetic, so the P..P+2 propagation days cannot leak in
        even when present. The determination must be RECORDED — committed or posted, timestamped —
        before any export with as_of >= P + 3 is taken.
      why_that_matters: >
        The verdict class is fixed before the outcome is observable, which is what stops the third
        verdict being an escape hatch. Observability by the evaluator is what carries that guarantee,
        not the calendar date: P - 1 + L < P + 3 + L identically in L, so the recording interval is
        never empty and never contains a post-window observation, for every lag and without knowing
        the lag in advance.
      fallback_if_history_does_not_survive_the_edit: >
        Pre-registered by DEC-0018, NOT selected later. Governs if and only if no export satisfying
        the clause above exists — the daily series did not survive the listing edit, or its coverage
        of [P - N, P - 1] is incomplete, or no capture landed with as_of <= P + 2. Then the mandatory
        pre-publish archive governs: the pre-window ends at P - 1 - L and N = min(28, P - F - 7 - L).
        PRECEDENCE IS STRICT — where both a valid primary-clock export and the archive exist, the
        primary clock governs, with no exception available to the reader. The governing branch and the
        observable fact that triggered it are recorded BEFORE any post-window datum is read.
      contaminated_determination: >
        A floor determined from an export with as_of >= P + 3, or recorded after such an export was
        taken, returns UNREADABLE-BY-PROCEDURE. This is NOT the UNREADABLE verdict below and does NOT
        trigger the post-only absolute floor. It states that the pre-registered procedure was not
        followed, and it goes to the board rather than being resolved by the Analyst.
    mandatory_pre_publish_archive:
      ruling: "DEC-0018 (CEO, 2026-09-29, APP-185). Unconditional — it gates the publish."
      when: "Between P - 1 and the submission of the listing edit at P. Its as_of will be P - 1 - L."
      what: >
        The full daily impressions series, exported and archived. This is NOT the floor determination.
      why: >
        Growth's retention question on APP-54 — does the daily series still return dates preceding the
        most recent listing update? — is still unanswered. If the answer is no, the edit at P destroys
        the pre-window ITSELF, which is the denominator of the 2x ratio and not merely the floor.
        DEC-0014 did not cover this because it assumed the capture happened at P. Making the archive
        conditional on the answer would mean learning the answer at the moment it is too late to act.
      gate: "If this archive does not exist, the rewrite does not publish."
  verdicts:
    PASS: "post mean daily impressions >= 2x pre mean daily impressions."
    FAIL: >
      post mean < 2x pre mean, with the pre-window over the floor. The "discovery is a copy problem"
      hypothesis is dead and the constraint is off-store distribution. Recorded as a DEC and NOT
      iterated on — exactly as DEC-0006 specified.
    UNREADABLE: >
      pre-window total below 20, declared on the governing determination per DEC-0018 (DEC-0014 said
      "declared at P"; see readability_floor.evaluated). The hypothesis is neither confirmed nor killed on
      this evidence, and a post-only absolute floor pre-registered at P governs instead. If this
      fires, the honest reading is that CWS impressions at this traffic level cannot test this
      hypothesis, and the correct move is to stop testing it with this instrument — not to re-run it
      hoping for a louder signal.
  on_trip: >
    On FAIL, Growth records the DEC and stops ALL further listing-copy iteration on this product. No
    re-draft, no second rewrite. The DEC id is allocated by the allocator per DEC-0015, not chosen by
    hand — an earlier revision of this record hand-reserved "DEC-0009", which was already taken.
  frozen_at: >
    Per DEC-0014's own risk section: once the first post-window data point exists, this construction
    is frozen — N, F, the floor and the three-day exclusion included. Any later change is a board
    matter, not a CEO one, and not Growth's. DEC-0018 is permitted on the same footing DEC-0014 was:
    APP-54 stands at 0 of 3 CSVs, so no post-window datum — no datum of any kind — exists yet.
  installs: "Secondary read only. Unchanged."

measurement:
  instrument: "Chrome Web Store Developer Dashboard only - impressions and installs. No product telemetry required, which is the reason this is the correct first step."
  reported_with_the_result:
    - "N, and the live-day count on each side"
    - "F, and whether the 2026-09-25 conservative default was used"
    - "the pre-window total, and the readability determination"
    - "which clock governed the determination (DEC-0018 primary or fallback), and the observable fact that decided it"
    - "the governing export's as_of and exported_at, and the derived lag L"
    - "per-day coverage of the pre-window — which days are present, which missing, which zero"
  computed_by: "Analyst, mechanically from the construction above, with no judgement left at the point of reading."
  first_publish_date_F:
    value: null
    bounded_to: "2026-09-23 .. 2026-09-25"
    default_if_unresolved: "2026-09-25 (conservative — the latest candidate never claims a live day that might not have been live)"
    correction: >
      CORRECTED 2026-09-29, and this reverses a claim Growth made on APP-34 on 2026-09-28. Growth
      cited `appforge-control/config/portfolio.yaml` as a committed config fact recording
      `first_published: "2026-09-20"` and offered it as a traceability upgrade over the CEO's
      issue-comment date. That was wrong in the opposite direction: the line cited was the first
      line of a CTO comment REFUTING that date, the record's value is `first_published: null`, and
      at the time the file was not even tracked. QA caught this on APP-34 and it is Growth's to fix.
    evidence:
      - "json-workbench/logs/chrome-store/2026-09-20-release.log is 5 lines: four DISCOVERING scans and `[ERROR] [BLOCKED] Found 3 secret findings`. No publish event. Re-verified 2026-09-29."
      - "`git tag --format='%(creatordate:short)'` returns 2026-09-23 for BOTH v0.1.0 and v0.2.0. Re-verified 2026-09-29."
      - "config/portfolio.yaml now records json-workbench `first_published: null`, reason_code `first_published_null`, with spec_defects.D4 documenting the 2026-09-20 value as unsupported and corrected. APP-41 (done) landed that."
    still_open: "A store-verified first-publish date has not been recovered from repo evidence. F stays null and the 2026-09-25 default governs unless the dashboard export on APP-54 settles it."
  publish_date_P:
    status: "NOT SETTLED — and explicitly not the CEO's to settle. DEC-0014 routes it to the board."
    arithmetic: "N <= P - F - 7. With the conservative F = 2026-09-25: N = 14 requires P >= 2026-10-16; N = 28 requires P >= 2026-10-30. At P = 2026-09-28 the expression is NEGATIVE — no valid pre-window exists and the before/after read cannot be constructed at all."
    growth_read: >
      Publishing immediately does not weaken this experiment, it removes it. Growth's position is
      that the earliest defensible P is 2026-10-16, and that the wait is close to free: the publish
      was going to spend that time gated regardless (G7 board approval ungranted, APP-47 baseline
      blocked on APP-54's CSVs, APP-63's precondition unmet). The bundled-release ruling makes the
      wait cheaper still — see publish_path.review_clock_is_not_a_cost.
  confound_to_control:
    - >
      OPP-0001 S3 (a DEV / r/dataengineering distribution post) must NOT run inside the post-window,
      or impressions cannot be attributed to the copy change. Already company policy: DEC-0006
      defers S3 until S1 has been measured, reaffirmed by the CEO on APP-34 on 2026-09-28. Growth
      will not publish a launch post before the window closes.
    - >
      The bundled patch release refreshes the item's "last updated" date, which independently
      affects ranking. This is a known, accepted confound of the CEO's 2026-09-29 bundle ruling.
      Note it in the readout; do not claim a clean copy-only attribution.
  required_input:
    - id: R1
      what: "Daily CWS impressions and installs covering the pre-window, from the Developer Dashboard."
      owner: "Analyst (APP-47), whose input is QA's CSV export on APP-54"
      changed_from_draft: >
        The draft asked for WEEKLY figures for "the 4 weeks before". DEC-0014's construction is
        per-live-day, so the export must be DAILY and must cover from F forward — weekly buckets
        cannot be decomposed into live-day means, and cannot be used to determine F.
      why: >
        The CWS Developer Dashboard is credentialed; Growth must never hold or request store
        credentials (AGENTS.md universal rule 4) and the CWS API cannot report impressions.
      status: outstanding
      caveat_from_qa: >
        The dashboard may return zeros rather than absent rows for pre-launch days, in which case a
        live day with no impression is indistinguishable from a day with no listing and F cannot be
        read from impressions at all. DEC-0014's 2026-09-25 default handles that case.
  baseline_window_defect:
    status: RESOLVED
    resolved_by: "DEC-0014"
    history: >
      Growth raised this on APP-34 on 2026-09-28 — that both ways of slicing a 4-weeks-before window
      were unreadable and failed in opposite directions, that averaging the full 4 weeks gives a
      meaningless PASS, and that using only the live weeks measures against the launch novelty
      boost. QA filed it as APP-59. DEC-0014 took neither of the two slicings: it rebuilt the
      windows to be equal in LIVE days and added the readability floor, which is the piece nobody
      had asked for and the one that makes "too noisy to call" a statement made in advance rather
      than a conclusion reached afterwards. Kept here as history because the record should show the
      defect was found before publish, not after a readout.

# ---------------------------------------------------------------------------
# HOW THIS ACTUALLY SHIPS
# ---------------------------------------------------------------------------
publish_path:
  ruling: "Both fields ship together in ONE PATCH RELEASE. CEO, 2026-09-29, APP-34 card e173d7ea option `bundle`."
  ruling_overrides: >
    APP-34's original "no package re-review" scoping, deliberately and on the record. The CEO's
    stated reason is measurement, not ambition: EXP-0001 exists to read a before/after window, and a
    treatment split across two start dates produces a window nobody can interpret. The title is also
    the field OPP-0001 named as the binding gap, so a short-description-only ship would test the
    weaker half of the hypothesis.
  short_description:
    field: "chrome-store/store.config.json -> shortDescription"
    mechanism: "Genuinely listing-only. release-platform validates it (required, max 132) and it reaches the published payload."
    needs_release: false
  title:
    field: "apps/extension/manifest.json -> name. chrome-store/store.config.json -> name must be set to the SAME string."
    mechanism: >
      NOT a listing-only edit. The Chrome Web Store takes the item title from the PUBLISHED
      PACKAGE's manifest `name`; the Store listing tab in the Developer Dashboard has no title field
      at all. Changing the title therefore requires a version bump, a rebuilt package, an upload and
      a full store review.
    needs_release: true
    correction: >
      CORRECTED 2026-09-29, and this is a correction to Growth's own reasoning on APP-34 on
      2026-09-28. Growth argued the title could not ship through store.config.json because the file
      has no `name` key. The KEY IS THERE — it is the first top-level key, value "JSON Workbench" —
      and release-platform's listing.mjs read it, validated nothing about it, and dropped it before
      the published payload. So the conclusion was right and the reason was wrong, and the wrong
      reason understated the danger: editing the title in store.config.json was not an
      impossible-so-nobody-would-try edit, it was a NO-OP THAT REPORTED SUCCESS. QA established this
      on APP-69 and CTO confirmed it from the pipeline.
    why_the_correction_matters_at_the_gate: >
      The G7 listing diff is rendered from the source file, not from the published payload. Before
      APP-69's fix, that diff would have shown the board a new title that the publish silently
      discarded — the approver seeing the diff was not a control. CTO's APP-69 branch
      (`fix/APP-69-listing-name` in release-platform) turns that mismatch into a hard CI failure and
      carries `name` into the checklist, so the board sees the real title. APP-69 is unmerged: no
      agent has write access to release-platform, and APP-92 is with the CEO on the delivery path.
  review_clock_is_not_a_cost_here:
    finding: >
      CTO flagged the CWS re-review turnaround as a timing risk for EXP-0001, on the reasoning that
      a title change has variable, uncontrolled latency while a short-description change does not.
      Under DEC-0014 that risk inverts. The binding constraint on P is not "ship as soon as
      possible", it is P >= 2026-10-16 for a decision-grade N of 14. The review clock runs INSIDE a
      wait the measurement construction already requires, so bundling costs schedule only if review
      pushes the effective live date past a board-set P — not merely because review takes time.
    what_it_does_change: "The experiment's start date is whenever review clears, so P is observed rather than chosen. Analyst must anchor the windows on the actual live date, not on the submit date or the approval date."
  builder_scope:
    files: ["apps/extension/manifest.json (name + version)", "chrome-store/store.config.json (name + shortDescription)"]
    version: "0.2.0 -> 0.2.1 (patch)"
    not_in_scope: ["the long description", "screenshots", "promo images", "permissions", "any product code"]
    verification_caveat: >
      The CI check that would catch a manifest/store.config `name` mismatch is on the unmerged
      APP-69 branch. Until it merges, the two `name` values must be verified equal BY HAND in
      review. This is exactly the failure mode APP-69 exists to prevent, and it is live on this very
      PR.
  dispatch_reality:
    workflow: ".github/workflows/listing.yml in json-workbench"
    note: >
      The CWS API cannot change a listing at all. For Chrome the listing workflow only opens a
      `store-listing` issue containing the files, the dashboard link and the exact steps including
      "Submit for review". The field edit and the submit are a manual founder action in the
      dashboard. Neither Growth nor the CEO dispatches it - CTO/Release does.

gates:
  - status: SETTLED
    gate: "CEO selects the pairing and the publish path."
    outcome: "T1 + S1; bundle both fields in one patch release. 2026-09-29, card e173d7ea."
  - status: OPEN
    gate: "G7 BOARD APPROVAL, carrying the listing diff, raised by CTO. §10.3's G7 names 'listing' explicitly."
    note: >
      The CEO ruled that publishing is not the CEO's to approve, and that nobody shortcuts G7 on the
      grounds that the change "is only text". An earlier revision of this record read DEC-0006 as
      satisfying this gate; that reading is withdrawn. DEC-0006 approves the DRAFTING and the PR,
      nothing beyond. The CEO also declined the `cto_verifies` option as a blocking hop: CTO
      confirms the publish path AS PART OF the G7 review, not before it.
    preconditions_carried_into_the_approval_payload:
      - "APP-63 — the G7 approval payload must name DEC-0014's readability determination and the board-set P as satisfied, or record an explicit waiver. APP-63 is blocked by APP-47 and APP-69."
      - "APP-47 — Analyst returns a defensible pre-window (N, F, live-day counts, pre-window total). Blocked by APP-54."
      - "APP-69 — the store.config/manifest `name` consistency check, so the G7 diff cannot show the board a title the publish would drop."
  - status: OPEN
    gate: "The publish date P itself. DEC-0014 routes it to the board, not the CEO."
  - status: STANDING
    gate: "CTO/Release dispatches `.github/workflows/listing.yml`; the founder completes the dashboard edit and Submit for review. Never Growth, never the CEO directly."

next_steps:
